name: API CI

on:
  pull_request:
    paths:
      - "api/**"
      - "firebase.json"
      - "firestore.*"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm i -g firebase-tools
      - run: firebase emulators:exec --project demo-lineup --only firestore --config ../firebase.json "go test ./..."
